name: atmos_presentation
description: The screens and view models of Atmos. Knows the domain, never the data layer.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  atmos_domain:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # gen-l10n: ARB files in lib/src/l10n/arb, configured in l10n.yaml (ADR-0005).
  generate: true
