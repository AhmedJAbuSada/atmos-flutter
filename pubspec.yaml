name: atmos
description: "Atmos, a weather app (Flutter tutorial). The app is the composition root."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# One package per layer, resolved together by one `flutter pub get` (ADR-0001).
workspace:
  - packages/domain
  - packages/data
  - packages/presentation

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # The app is the only package that depends on every layer (ADR-0004).
  atmos_domain:
  atmos_data:
  atmos_presentation:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
